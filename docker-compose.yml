services:
  timelapse:
    image: zhf883680/lapsecam:latest
    container_name: timelapse
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data        # 视频/帧/数据库持久化
      - ./config:/app/config    # 配置（可挂载后修改）
    environment:
      - TZ=Asia/Shanghai
      # AI 打印健康分析的 API Key（可选；OpenAI 兼容服务，默认 DeepSeek）。
      # 也可直接在 config.yaml 的 vision.apiKey 填写。
      - VISION_API_KEY=${VISION_API_KEY:-}
