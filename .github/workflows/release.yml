name: release

# 推送 v* 标签时自动触发：
#   1. 编译 Linux 多架构静态二进制
#   2. 构建并推送多架构 Docker 镜像到 Docker Hub
#   3. 创建 GitHub Release 并上传二进制附件
#
# 发布方法：git tag v1.2.3 && git push origin v1.2.3

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # 创建 Release / 上传附件

jobs:
  binaries:
    name: 编译二进制 (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            goarch: amd64
          - name: arm64
            goarch: arm64
          - name: armv7
            goarch: arm
            goarm: "7"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/lapsecam-linux-${{ matrix.name }}" ./cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lapsecam-linux-${{ matrix.name }}
          path: dist/lapsecam-linux-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7

  docker:
    name: 构建并推送 Docker 镜像（Docker Hub）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: zhf883680
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: zhf883680/lapsecam
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/lapsecam-linux-*
