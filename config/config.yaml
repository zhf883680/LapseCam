server:
  addr: ":8080"

database:
  path: "data/database.db"

storage:
  baseDir: "data"      # 数据根目录（Docker 中挂载持久化）
  framesDir: "frames"  # 抽帧图片，data/frames/task-{id}/%06d.jpg
  videosDir: "videos"  # 成片，data/videos/task-{id}/*.mp4

ffmpeg:
  binary: "ffmpeg"
  ffprobe: "ffprobe"
  probeTimeout: 8s        # 摄像头探测超时
  rtspTransport: "tcp"    # RTSP 传输协议：tcp / udp
  captureJPEGQuality: 2   # JPEG 质量 2-31，越小越清晰
  captureBackoff: ["5s", "10s", "30s", "60s"]  # 断线重连退避序列
  encodePreset: "veryfast"      # x264 preset：ultrafast/superfast/veryfast/faster/fast/medium/slow/veryslow
                                  #   CPU 吃紧时用 veryfast/ultrafast，文件略大但快很多
  encodeCRF: 26                  # x264 CRF：越小质量越高；延时摄影建议 26-28
  encodeMaxRateKbps: 4000         # 成片码率上限 kbps，防止画面突变时体积暴涨
  encodeThreads: 0               # 编码线程数；0=自动。小盒子 CPU 想降负载可设 2-3

preview:
  enabled: true               # Web 实时预览（go2rtc），浏览器直接看摄像头
  binary: "go2rtc"            # go2rtc 可执行文件（Docker 已内置；ARM 安装脚本自动下载）
  addr: "127.0.0.1:1984"      # go2rtc 内部监听地址，只绑本机，经 LapseCam 反代 /go2rtc/ 对外
  basePath: "/go2rtc"         # 反代前缀
  rtspTransport: "tcp"        # 预览拉流传输协议：tcp / udp
  media: "video"              # 只取视频轨
  startTimeout: 10s           # 启动等待 go2rtc 就绪超时

scheduler:
  tickSeconds: 1           # 任务调度轮询间隔
  cameraCheckSeconds: 60   # 摄像头在线状态轮询间隔；0 表示关闭自动探测

quick:
  name: "快捷录制"
  captureMode: "interval"     # 抽帧模式：interval=定时抽帧(默认) | layer=逐层截图 | timestamp=逐层选帧
  intervalSeconds: 5          # 抽帧间隔（秒），interval/timestamp 模式使用
  layerOffsetSeconds: 0       # timestamp 模式：选帧目标时刻 = 层变化时刻 + 偏移（秒，可负，需实测校准）
  layerWindowSeconds: 5       # timestamp 模式：选帧窗口（秒），窗口内取最接近的一帧
  outputFps: 30
  width: 1280
  height: 720

cleanup:
  enabled: true                 # 自动清理总开关（手动清理不受此开关控制）
  intervalHours: 24             # 自动清理间隔（小时）
  removeFramesAfterEncode: true # 出片成功后删除中间帧（最占空间，一次几小时录制几个 GB）
  videoRetentionDays: 0         # 0=保留全部；>0 只保留最近 N 天视频记录及文件
  removeOrphans: true           # 清理孤儿数据（无主 task-{id} 目录/日志/标记）
