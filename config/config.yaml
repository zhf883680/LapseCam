server:
  addr: ":8080"

database:
  path: "data/database.db"

storage:
  baseDir: "data"      # 数据根目录（Docker 中挂载持久化）
  framesDir: "frames"  # 抽帧图片，data/frames/task-{id}/%06d.jpg
  videosDir: "videos"  # 成片，data/videos/task-{id}/*.mp4

ffmpeg:
  binary: "ffmpeg"
  ffprobe: "ffprobe"
  probeTimeout: 8s        # 摄像头探测超时
  rtspTransport: "tcp"    # RTSP 传输协议：tcp / udp
  captureJPEGQuality: 2   # JPEG 质量 2-31，越小越清晰
  captureBackoff: ["5s", "10s", "30s", "60s"]  # 断线重连退避序列
  encodePreset: "medium"  # x264 preset：ultrafast/superfast/veryfast/faster/fast/medium/slow
  encodeCRF: 20           # x264 CRF：越小质量越高

scheduler:
  tickSeconds: 1           # 任务调度轮询间隔
  cameraCheckSeconds: 60   # 摄像头在线状态轮询间隔；0 表示关闭自动探测

quick:
  name: "快捷录制"
  intervalSeconds: 5
  outputFps: 30
  width: 1920
  height: 1080
