# ============================================================
# LapseCam 生产配置文件（ARM 设备部署版）
# 用法：lapsecam -config /etc/lapsecam/config.yaml
# ============================================================

server:
  addr: ":19090"                  # HTTP 端口（避开常用的 8080/18080，可自行修改）

database:
  path: "/mnt/data/lapsecam/database.db"   # SQLite 数据库文件

storage:
  baseDir: "/mnt/data/lapsecam"            # 数据根目录（视频/图片都在这里）
  framesDir: "frames"                  # 抽帧图片 → /mnt/data/lapsecam/frames/task-{id}/
  videosDir: "videos"                  # 成片视频 → /mnt/data/lapsecam/videos/task-{id}/

ffmpeg:
  binary: "/usr/bin/ffmpeg"            # apt 安装 ffmpeg 后的默认路径
  ffprobe: "/usr/bin/ffprobe"
  probeTimeout: 10s                    # 测试摄像头连接超时（ARM 设备稍放宽）
  rtspTransport: "tcp"                 # RTSP 传输协议：tcp / udp
  captureJPEGQuality: 2                # 抽帧 JPEG 质量 2-31，越小越清晰
  captureBackoff: ["5s", "10s", "30s", "60s"]   # 断线重连退避序列
  encodePreset: "veryfast"             # ARM CPU 较弱，用 veryfast 平衡编码速度与体积（想更快可改 ultrafast）
  encodeCRF: 27                        # x264 质量，越小越清晰；延时摄影建议 26-28
  encodeMaxRateKbps: 3000               # 成片码率上限 kbps，防止画面突变时体积暴涨
  encodeThreads: 0                      # 编码线程数；0=自动。想明显降低 CPU 占用可设 2（编码变慢但不再吃满）

preview:
  enabled: true                       # Web 实时预览（go2rtc）
  binary: "go2rtc"                    # 安装脚本会自动下载到 /usr/local/bin/go2rtc
  addr: "127.0.0.1:1984"              # 只绑本机，经 LapseCam 反代 /go2rtc/ 对外
  basePath: "/go2rtc"
  rtspTransport: "tcp"
  media: "video"
  startTimeout: 15s                   # ARM 启动稍慢，放宽一点

scheduler:
  tickSeconds: 1                       # 任务调度轮询间隔（秒）
  cameraCheckSeconds: 60               # 摄像头在线状态探测间隔；0 = 关闭

quick:
  name: "快捷录制"
  captureMode: "interval"     # 抽帧模式：interval=定时抽帧(默认) | layer=逐层截图 | timestamp=逐层选帧
  intervalSeconds: 5          # 抽帧间隔（秒），interval/timestamp 模式使用
  layerOffsetSeconds: 0       # timestamp 模式：选帧目标时刻 = 层变化时刻 + 偏移（秒，可负，需实测校准）
  layerWindowSeconds: 5       # timestamp 模式：选帧窗口（秒），窗口内取最接近的一帧
  outputFps: 30
  width: 1280
  height: 720
